<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>수시 실시간 경쟁률</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <h1>수시 실시간 경쟁률</h1>
  <div class="updated-at" id="updatedAt">불러오는 중...</div>
</header>

<section class="controls">
  <input type="search" id="searchInput" placeholder="대학명 / 모집단위 검색">
  <select id="regionFilter"><option value="">전체 지역</option></select>
  <select id="typeFilter">
    <option value="">전체 유형</option>
    <option value="4년제">4년제</option>
    <option value="전문대">전문대</option>
  </select>
  <select id="sortSelect">
    <option value="ratio-desc">경쟁률 높은 순</option>
    <option value="ratio-asc">경쟁률 낮은 순</option>
    <option value="applicants-desc">지원인원 많은 순</option>
    <option value="university">대학명순</option>
  </select>
</section>

<section class="summary" id="summary"></section>

<main>
  <table id="ratioTable">
    <thead>
      <tr>
        <th>#</th>
        <th>대학</th>
        <th>캠퍼스</th>
        <th>전형</th>
        <th>모집단위</th>
        <th>모집</th>
        <th>지원</th>
        <th>경쟁률</th>
      </tr>
    </thead>
    <tbody id="tableBody"></tbody>
  </table>
  <p id="emptyState" class="empty-state" hidden>표시할 데이터가 없습니다.</p>
</main>

<footer>
  <p>데이터 출처: 각 대학 입학처 공개 경쟁률 페이지 (진학어플라이 부가서비스 등). 참고용이며 최종 수치는 반드시 각 대학 공식 발표를 확인하세요.</p>
</footer>

<script src="app.js"></script>
</body>
</html>
