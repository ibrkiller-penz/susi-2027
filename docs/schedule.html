<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>2027 수시 일정표 · 일자별</title>
<style>
:root{
  --ink:#1a1a1a; --ink2:#6b7280; --ink3:#9aa2b1;
  --paper:#f7f7f8; --card:#fff; --line:#e5e7eb; --soft:#eff6ff;
  --accent:#2563eb; --header-bg:#111827; --header-text:#ffffff;
  --p:#a15c0a; --pbg:#fdf1de;
  --n:#6a3ea1; --nbg:#f1eafa;
  --i:#0c6a69; --ibg:#e1f2f0;
  --sun:#b3402f; --sat:#2a5aa8;
}
@media (prefers-color-scheme: dark){
  :root{
    --ink:#e5e7eb; --ink2:#9ca3af; --ink3:#6b7280;
    --paper:#0f1115; --card:#171a21; --line:#2a2e37; --soft:#1e293b;
    --accent:#60a5fa; --header-bg:#0b0d11; --header-text:#f3f4f6;
  }
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);
  font-family:-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;
  font-size:15px;line-height:1.5;font-feature-settings:"tnum"}

header.top{background:var(--header-bg);color:var(--header-text);padding:20px 20px 18px}
.wrap{max-width:1160px;margin:0 auto}
.top h1{margin:0;font-size:26px;font-weight:800;letter-spacing:-.02em}
.top h1 span{color:#ffd98a}
.top p{margin:6px 0 0;font-size:13px;color:#a7b4c4}

.bar{position:sticky;top:0;z-index:30;background:color-mix(in srgb, var(--paper) 96%, transparent);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)}
.bar .wrap{padding:11px 20px 9px}
.r1{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sb{position:relative;flex:1 1 300px;min-width:200px}
.sb input{width:100%;padding:10px 34px 10px 13px;font:inherit;border:1.5px solid var(--line);
  border-radius:8px;background:var(--card);color:var(--ink)}
.sb input:focus{outline:2px solid var(--accent);outline-offset:1px}
.sb button{position:absolute;right:5px;top:50%;transform:translateY(-50%);border:0;background:none;
  cursor:pointer;font-size:17px;color:var(--ink3);padding:3px 7px;border-radius:6px}
.sb button:hover{background:var(--soft);color:var(--ink)}
.dp{display:flex;gap:5px;align-items:center;background:var(--card);border:1.5px solid var(--line);
  border-radius:8px;padding:5px 8px}
.dp label{font-size:12.5px;color:var(--ink2);white-space:nowrap}
.dp input{font:inherit;font-size:14px;border:0;background:none;color:var(--ink);width:135px}
.dp input:focus{outline:none}
.dp .x{border:0;background:none;cursor:pointer;color:var(--ink3);font-size:15px;padding:0 3px}
.cnt{font-size:13px;color:var(--ink2);white-space:nowrap}
.cnt b{color:var(--ink)}
.chips{display:flex;gap:5px;flex-wrap:wrap;margin-top:8px}
.chip{font:inherit;font-size:12.5px;padding:4px 10px;border-radius:999px;border:1.5px solid var(--line);
  background:var(--card);color:var(--ink2);cursor:pointer}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.chips .sep{width:1px;background:var(--line);margin:2px 4px}

main{max-width:1160px;margin:0 auto;padding:18px 20px 60px}

.mh{display:flex;align-items:baseline;gap:9px;margin:30px 0 10px;padding-bottom:6px;
  border-bottom:2px solid var(--ink)}
.mh:first-child{margin-top:2px}
.mh b{font-size:28px;font-weight:800;letter-spacing:-.03em}
.mh i{font-style:normal;font-size:12.5px;color:var(--ink3)}

.day{background:var(--card);border:1px solid var(--line);border-radius:10px;margin-bottom:9px;
  display:flex;overflow:hidden}
.dl{flex:0 0 92px;padding:11px 10px 11px 14px;border-right:1px solid var(--soft);background:var(--soft)}
.dl .dd{font-size:21px;font-weight:800;letter-spacing:-.03em;line-height:1.1}
.dl .wd{font-size:12.5px;color:var(--ink3);margin-top:1px}
.dl .hol{display:inline-block;margin-top:5px;font-size:11px;padding:1px 6px;border-radius:4px;
  background:#fbe4de;color:#a8331f;font-weight:700}
.dl .hol.exam{background:var(--ink);color:#ffd98a}
.dl .num{font-size:11.5px;color:var(--ink3);margin-top:5px}
.dl.sun .dd{color:var(--sun)} .dl.sat .dd{color:var(--sat)}
.dr{flex:1 1 auto;min-width:0;padding:7px 14px 9px}

.grp{padding:3px 0}
.grp+.grp{border-top:1px dashed var(--soft);margin-top:3px}
.gt{font-size:11.5px;font-weight:700;padding:4px 0 2px;display:flex;align-items:center;gap:6px}
.gt s{width:7px;height:7px;border-radius:2px;display:inline-block;text-decoration:none}
.g-p .gt{color:var(--p)} .g-p s{background:var(--p)}
.g-n .gt{color:var(--n)} .g-n s{background:var(--n)}
.g-i .gt{color:var(--i)} .g-i s{background:var(--i)}
ul{list-style:none;margin:0;padding:0}
li{display:flex;gap:8px;align-items:baseline;padding:2.5px 0;font-size:14px;line-height:1.45}
.u{flex:0 0 auto;min-width:88px;font-weight:700;letter-spacing:-.02em;cursor:pointer}
.g-p .u{color:var(--p)} .g-n .u{color:var(--n)} .g-i .u{color:var(--i)}
.u:hover{text-decoration:underline}
.b{flex:1 1 auto;min-width:0}
mark{background:#ffe07a;color:inherit;padding:0 1px;border-radius:2px}

.uniview .day{flex-direction:row}
.empty{text-align:center;padding:56px 20px;color:var(--ink2);background:var(--card);
  border:1px dashed var(--line);border-radius:10px}
.empty b{display:block;font-size:17px;color:var(--ink);margin-bottom:5px}

details{margin-top:24px;background:var(--card);border:1px solid var(--line);border-radius:10px}
summary{cursor:pointer;padding:11px 14px;font-weight:700;font-size:14px}
.ulist{padding:0 14px 14px;display:flex;flex-wrap:wrap;gap:5px}
.ub{font:inherit;font-size:12.5px;padding:3px 9px;border-radius:999px;border:1px solid var(--line);
  background:var(--soft);color:var(--ink2);cursor:pointer}
.ub:hover{border-color:var(--accent);color:var(--ink)}
footer{max-width:1160px;margin:0 auto;padding:0 20px 46px;font-size:12.5px;color:var(--ink3);line-height:1.7}

@media(max-width:640px){
  .day{flex-direction:column}
  .dl{flex:auto;border-right:0;border-bottom:1px solid var(--soft);display:flex;align-items:baseline;gap:8px;padding:8px 12px}
  .dl .dd{font-size:17px}.dl .num{margin:0}
  li{flex-direction:column;gap:0}
  .u{min-width:0}
  .top h1{font-size:21px}
}
@media print{
  .bar,details{display:none}
  body{background:#fff;font-size:10.5px}
  header.top{background:#fff;color:#000;border-bottom:2px solid #000}
  .top h1 span{color:#000}.top p{color:#333}
  .day{break-inside:avoid;border-color:#bbb}
}
.site-nav{display:flex;gap:4px;padding:8px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.site-nav a{padding:7px 14px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink2);text-decoration:none}
.site-nav a:hover{background:var(--soft);color:var(--ink)}
.site-nav a.active{background:var(--accent);color:#fff}
</style>
</head>

<nav class="site-nav">

</div></div>

<main>

    <div class="ulist" id="ulist"></div>
  </details>
</main>

<footer>

const WD=["일","월","화","수","목","금","토"];
const HOL={"2026-09-24":"추석연휴","2026-09-25":"추석","2026-09-26":"추석연휴",
"2026-10-03":"개천절","2026-10-05":"대체공휴일","2026-10-09":"한글날",
"2026-11-19":"수능","2026-12-25":"성탄절","2027-01-01":"신정"};
const GN={p:"발표 · 최종",n:"논술",i:"면접 · 실기 · 고사"};

function esc(s){return s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]))}
function hl(s,q){const e=esc(s);if(!q)return e;
  const i=e.toLowerCase().indexOf(q.toLowerCase());if(i<0)return e;
  return e.slice(0,i)+"<mark>"+e.slice(i,i+q.length)+"</mark>"+e.slice(i+q.length)}

function render(){
  const q=st.q.trim().toLowerCase();
  const rows=DATA.filter(r=>{
    if(st.t!=="all"&&r[1]!==st.t)return false;
    if(st.d&&r[0]!==st.d)return false;
    if(st.m!=="all"&&Number(r[0].slice(5,7))!==Number(st.m))return false;
    if(q&&!(r[3].toLowerCase().includes(q)||r[2].toLowerCase().includes(q)))return false;
    return true;
  });
  const byDay=new Map();
  rows.forEach(r=>{if(!byDay.has(r[0]))byDay.set(r[0],[]);byDay.get(r[0]).push(r)});
  let html="",lastM="";
  for(const [dt,list] of byDay){
    const d=new Date(dt+"T00:00:00"), mk=dt.slice(0,7);
    if(mk!==lastM){lastM=mk;
      html+=`<div class="mh"><b>${Number(mk.slice(5,7))}월</b><i>${mk.slice(0,4)}년</i></div>`}
    const wd=d.getDay(), cls=wd===0?"sun":wd===6?"sat":"";
    const hol=HOL[dt];
    const groups=["p","n","i"].map(k=>{
      const it=list.filter(r=>r[1]===k);
      if(!it.length)return "";
      return `<div class="grp g-${k}"><div class="gt"><s></s>${GN[k]} ${it.length}</div><ul>`+
        it.map(r=>{
          const rest=r[3].startsWith(r[3].split(" ")[0])?r[3].slice(r[3].split(" ")[0].length).trim():r[3];
          return `<li><span class="u" data-u="${esc(r[2])}">${hl(r[2],st.q.trim())}</span><span class="b">${hl(rest,st.q.trim())}</span></li>`
        }).join("")+`</ul></div>`;
    }).join("");
    html+=`<section class="day"><div class="dl ${cls}">
      <div class="dd">${Number(dt.slice(5,7))}/${Number(dt.slice(8,10))}</div>
      <div class="wd">${WD[wd]}요일</div>
      ${hol?`<span class="hol ${hol==="수능"?"exam":""}">${hol}</span>`:""}
      <div class="num">${list.length}건</div></div>
      <div class="dr">${groups}</div></section>`;
  }
  document.getElementById("board").innerHTML = rows.length?html:
    `<div class="empty"><b>해당 조건의 일정이 없습니다</b>대학명 일부만 입력하거나 일자·유형 조건을 풀어 보세요.</div>`;
  document.getElementById("cnt").innerHTML=`<b>${rows.length}</b>건 / ${byDay.size}일`;
}

function syncChips(){

  document.querySelectorAll('#chips .chip[data-t]').forEach(c=>c.setAttribute("aria-pressed",String(c.dataset.t===st.t)));
}

});
